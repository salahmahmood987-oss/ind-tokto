name: Build AAB

# يبني حزمة Google Play (AAB) موقعة بمفتاح الرفع، من نفس كود v25.
# يشتغل يدوياً فقط من تبويب Actions (Run workflow) — مش مع كل push.
# النتيجة: ملف app-release.aab جاهز للرفع على Play Console.
# التوقيع بيتم بخصائص Gradle المحقونة من الأسرار، من غير أي تعديل
# في build.gradle أو في كود التطبيق.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 يتطلب Node >= 22 (مع Node 20 يفشل cap sync بخطأ fatal)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 يتطلب JDK 21 (مع JDK 17 يفشل التجميع بخطأ invalid source release: 21)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # sdkmanager مش على PATH في جهاز GitHub رغم إن ANDROID_HOME موجود،
      # فنضيف مسار cmdline-tools للـ PATH أولاً.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager --version

      - name: Install Android platform and build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # مفتاح الرفع محفوظ كسر في GitHub Actions (ANDROID_UPLOAD_KEYSTORE_BASE64).
      - name: Decode upload keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
          ls -lh android/app/upload.keystore

      # التوقيع بخصائص Gradle المحقونة — build.gradle مفيهوش signingConfig
      # للـ release، فالخصائص دي هي اللي بتوقع الحزمة بمفتاح الرفع.
      - name: Build signed AAB
        run: |
          cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.keystore" \
            -Pandroid.injected.signing.store.type=PKCS12 \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"

      # تحقق من الحزمة: بنية AAB سليمة + targetSdkVersion = 36 (أندرويد 16).
      - name: Verify AAB
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          unzip -l "$AAB" | head -40
          mkdir -p /tmp/aab-check
          unzip -o -q "$AAB" base/manifest/AndroidManifest.xml -d /tmp/aab-check
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file /tmp/aab-check/base/manifest/AndroidManifest.xml > /tmp/manifest.txt
          grep -E "targetSdkVersion|minSdkVersion|compileSdkVersion" /tmp/manifest.txt || true
          python3 -c "
          import re
          txt = open('/tmp/manifest.txt').read()
          m = re.search(r'targetSdkVersion.*0x([0-9a-fA-F]+)', txt)
          assert m, 'targetSdkVersion not found in manifest'
          v = int(m.group(1), 16)
          print('targetSdkVersion =', v)
          assert v == 36, f'expected targetSdk 36 (Android 16), got {v}'
          "

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ind-toktok-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
