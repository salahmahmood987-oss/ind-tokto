name: Build APK

# يشتغل تلقائياً مع كل push على main/master، أو يدوياً من تبويب Actions
# (Run workflow). النتيجة: ملف app-debug.apk جاهز للتحميل من صفحة الـ run.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # لا نستخدم android-actions/setup-android لأنه يحاول تثبيت حزمة
      # 'tools' المحذوفة من مستودع SDK فيفشل. جهاز ubuntu-latest الجاهز
      # فيه Android SDK مثبت مسبقاً (ANDROID_HOME) و sdkmanager على PATH.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ind-toktok-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
